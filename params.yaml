baseline:
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.98
  max_features: 100000
  max_iter: 2000
  class_weight: balanced

cnn:
  seed: 42
  max_vocab_size: 30000
  min_freq: 2
  embedding_dim: 128
  num_filters: 128
  kernel_sizes: [3, 4, 5]
  dropout: 0.3
  batch_size: 64
  learning_rate: 0.001
  max_epochs: 15
  patience: 3

routing:
  # Risk-control parameters for threshold selection.
  # Threshold selection uses simultaneous one-sided exact Clopper-Pearson
  # confidence bounds with a Bonferroni correction for multiple candidates.
  target_accuracy: 0.90
  alpha: 0.05
  min_accepted_samples: 50
  threshold_grid_start: 0.10
  threshold_grid_stop: 1.00
  threshold_grid_step: 0.01
  # Promotion: CNN must beat baseline by this minimum margin on validation
  # coverage (subject to both meeting the accuracy requirement).
  # Used by src/select_model.py (secondary ranking criterion).
  min_coverage_improvement: 0.02
